name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build self-contained release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/JunqLife-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JunqLife-Android-Test
          path: artifacts/JunqLife-test.apk
          if-no-files-found: error
          retention-days: 14
