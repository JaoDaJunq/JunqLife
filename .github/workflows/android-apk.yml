name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'plugins/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Verify Kotlin compiler pin
        run: |
          grep -n "kotlin-gradle-plugin:2.3.20" android/build.gradle
          grep -n "android.kotlinVersion=2.3.20" android/gradle.properties

      - name: Build self-contained release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/JunqLife.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JunqLife-Android-${{ steps.app_version.outputs.version }}
          path: artifacts/JunqLife.apk
          if-no-files-found: error
          retention-days: 14


      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/JunqLife.apk --clobber
            gh release edit "$TAG" --title "JunqLife $VERSION"
          else
            gh release create "$TAG" artifacts/JunqLife.apk \
              --title "JunqLife $VERSION" \
              --notes "APK oficial do JunqLife para Android. Instale por cima da versão anterior para atualizar." \
              --generate-notes
          fi
